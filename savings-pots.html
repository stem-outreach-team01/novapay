<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaPay — Savings Pots</title>
  <style>
    :root {
      --bg: #f4f5f9; --card: #ffffff; --ink: #1a1d29; --text: #374151; --muted: #5b6270;
      --border: #d8dce6; --accent: #5a50e0; --tint: #eeedfb; --good: #15803d; --bad: #b91c1c;
      --shadow: 0 12px 30px rgba(26, 29, 41, 0.08); --radius: 20px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #fff 0%, var(--bg) 45%, #edf0f7 100%);
      color: var(--text); line-height: 1.5; padding: 32px 16px 48px;
    }
    .shell { max-width: 1120px; margin: 0 auto; }
    h1, h2, h3, p { margin: 0; }
    .hero, .panel, .pot {
      background: var(--card); border: 1px solid rgba(216,220,230,.9);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .hero { padding: 28px; margin-bottom: 18px; position: relative; overflow: hidden; }
    .hero::after { content: ''; position: absolute; right: -80px; bottom: -80px; width: 220px; height: 220px; border-radius: 50%; background: rgba(90,80,224,.09); }
    .eyebrow { text-transform: uppercase; letter-spacing: .16em; font-size: .78rem; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
    h1 { font-size: clamp(2rem, 4vw, 3rem); color: var(--ink); margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; position: relative; z-index: 1; }
    .stat { border: 1px solid var(--border); border-radius: 16px; padding: 16px; background: #fafbff; }
    .stat .label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .stat .value { font-size: 1.5rem; font-weight: 700; color: var(--ink); }
    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
    .panel { padding: 20px; margin-bottom: 18px; }
    .panel h2 { color: var(--ink); font-size: 1.15rem; margin-bottom: 12px; }
    label { display: block; font-size: .85rem; font-weight: 600; color: var(--ink); margin: 10px 0 4px; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px;
      font: inherit; color: var(--ink); background: #fff;
    }
    input:focus, select:focus, button:focus-visible { outline: 3px solid rgba(90,80,224,.35); outline-offset: 1px; }
    button {
      font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 12px;
      padding: 10px 14px; background: var(--accent); color: #fff; margin-top: 14px; width: 100%;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: var(--tint); color: var(--accent); margin-top: 0; }
    button.danger { background: #fee2e2; color: var(--bad); margin-top: 0; }
    .pots { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .pot { padding: 18px; border-top: 6px solid var(--c, var(--accent)); }
    .pot h3 { color: var(--ink); display: flex; justify-content: space-between; gap: 8px; }
    .pot .bal { font-size: 1.8rem; font-weight: 800; color: var(--ink); margin: 6px 0; }
    .pot .goal { font-size: .85rem; color: var(--muted); }
    .bar { height: 10px; background: var(--tint); border-radius: 99px; overflow: hidden; margin: 8px 0 12px; }
    .bar span { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 99px; transition: width .4s; }
    .row { display: flex; gap: 8px; }
    .row input { min-width: 0; }
    .row button { margin-top: 0; width: auto; padding: 10px 12px; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .empty { color: var(--muted); text-align: center; padding: 30px; border: 2px dashed var(--border); border-radius: 18px; grid-column: 1/-1; }
    #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 99; }
    .toast {
      background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 14px; min-width: 240px; max-width: 340px;
      box-shadow: var(--shadow); border-left: 6px solid var(--accent); animation: in .25s ease-out;
    }
    .toast.success { border-left-color: #22c55e; }
    .toast.error { border-left-color: #ef4444; }
    .toast.out { opacity: 0; transform: translateX(20px); transition: .3s; }
    @keyframes in { from { opacity: 0; transform: translateX(30px); } }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">NovaPay savings</div>
      <h1>Your savings pots</h1>
      <p>Set money aside for what matters, and move it between pots whenever plans change.</p>
      <div class="stats">
        <div class="stat"><div class="label">Main account</div><div class="value" id="mainBal">£0.00</div></div>
        <div class="stat"><div class="label">Total in pots</div><div class="value" id="potsTotal">£0.00</div></div>
        <div class="stat"><div class="label">Number of pots</div><div class="value" id="potCount">0</div></div>
      </div>
    </section>

    <div class="layout">
      <aside>
        <section class="panel">
          <h2>Create a pot</h2>
          <form id="createForm">
            <label for="pName">Pot name</label>
            <input id="pName" maxlength="24" placeholder="e.g. Holiday" required />
            <label for="pGoal">Goal (£, optional)</label>
            <input id="pGoal" type="number" min="0" step="0.01" placeholder="500" />
            <label for="pColor">Colour</label>
            <select id="pColor">
              <option value="#5a50e0">Nova purple</option>
              <option value="#0ea5e9">Sky blue</option>
              <option value="#10b981">Green</option>
              <option value="#f59e0b">Amber</option>
              <option value="#ec4899">Pink</option>
            </select>
            <button type="submit">Create pot</button>
          </form>
        </section>

        <section class="panel">
          <h2>Transfer money</h2>
          <form id="transferForm">
            <label for="tFrom">From</label>
            <select id="tFrom"></select>
            <label for="tTo">To</label>
            <select id="tTo"></select>
            <label for="tAmt">Amount (£)</label>
            <input id="tAmt" type="number" min="0.01" step="0.01" placeholder="25.00" required />
            <button type="submit">Transfer</button>
          </form>
        </section>
      </aside>

      <section>
        <div class="pots" id="pots"></div>
      </section>
    </div>
  </main>
  <div id="toasts" aria-live="polite"></div>

  <script>
    const KEY = 'novapay-pots-v1';
    const MAIN = 'main';
    let state = load();

    function load() {
      try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.pots) return s; } catch (e) {}
      return { main: 1000, pots: [
        { id: 'p1', name: 'Holiday', balance: 150, goal: 800, color: '#0ea5e9' },
        { id: 'p2', name: 'Emergency', balance: 300, goal: 1000, color: '#10b981' }
      ] };
    }
    const save = () => localStorage.setItem(KEY, JSON.stringify(state));
    const money = n => '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const round = n => Math.round(n * 100) / 100;

    function toast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = 'toast ' + type;
      t.textContent = msg;
      document.getElementById('toasts').appendChild(t);
      setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 3200);
    }

    const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const find = id => state.pots.find(p => p.id === id);
    const nameOf = id => id === MAIN ? 'Main account' : find(id).name;
    const balOf = id => id === MAIN ? state.main : find(id).balance;
    function adjust(id, amt) { if (id === MAIN) state.main = round(state.main + amt); else find(id).balance = round(find(id).balance + amt); }

    function render() {
      document.getElementById('mainBal').textContent = money(state.main);
      document.getElementById('potsTotal').textContent = money(state.pots.reduce((s, p) => s + p.balance, 0));
      document.getElementById('potCount').textContent = state.pots.length;

      const wrap = document.getElementById('pots');
      wrap.innerHTML = state.pots.length ? '' : '<div class="empty">No pots yet — create your first one!</div>';
      state.pots.forEach(p => {
        const pct = p.goal ? Math.min(100, p.balance / p.goal * 100) : 0;
        const el = document.createElement('article');
        el.className = 'pot';
        el.style.setProperty('--c', p.color);
        el.innerHTML = `
          <h3>${esc(p.name)}</h3>
          <div class="bal">${money(p.balance)}</div>
          ${p.goal ? `<div class="bar"><span style="width:${pct}%"></span></div><div class="goal">${Math.round(pct)}% of ${money(p.goal)} goal</div>` : '<div class="goal">No goal set</div>'}
          <div class="row" style="margin-top:12px">
            <input type="number" min="0.01" step="0.01" placeholder="£ amount" aria-label="Amount for ${esc(p.name)}" />
            <button data-act="pay">Pay in</button>
            <button class="secondary" data-act="withdraw">Withdraw</button>
          </div>
          <div class="actions"><button class="danger" data-act="delete">Delete pot</button></div>`;
        el.addEventListener('click', e => {
          const act = e.target.dataset.act; if (!act) return;
          const input = el.querySelector('input');
          if (act === 'delete') return del(p.id);
          const amt = round(parseFloat(input.value));
          if (!(amt > 0)) return toast('Enter an amount greater than £0', 'error');
          if (act === 'pay') {
            if (amt > state.main) return toast("Not enough in your main account", 'error');
            state.main = round(state.main - amt); p.balance = round(p.balance + amt);
            toast(`Paid ${money(amt)} into ${p.name}`);
            if (p.goal && p.balance >= p.goal) toast(`🎉 ${p.name} goal reached!`);
          } else {
            if (amt > p.balance) return toast(`Only ${money(p.balance)} in ${p.name}`, 'error');
            p.balance = round(p.balance - amt); state.main = round(state.main + amt);
            toast(`Withdrew ${money(amt)} from ${p.name}`);
          }
          save(); render();
        });
        wrap.appendChild(el);
      });

      const opts = [`<option value="${MAIN}">Main account (${money(state.main)})</option>`]
        .concat(state.pots.map(p => `<option value="${p.id}">${esc(p.name)} (${money(p.balance)})</option>`)).join('');
      const from = document.getElementById('tFrom'), to = document.getElementById('tTo');
      const fv = from.value || MAIN, tv = to.value;
      from.innerHTML = opts; to.innerHTML = opts;
      from.value = [...from.options].some(o => o.value === fv) ? fv : MAIN;
      to.value = [...to.options].some(o => o.value === tv) ? tv : (state.pots[0] ? state.pots[0].id : MAIN);
    }

    function del(id) {
      const p = find(id);
      if (!confirm(`Delete "${p.name}"? Its ${money(p.balance)} goes back to your main account.`)) return;
      state.main = round(state.main + p.balance);
      state.pots = state.pots.filter(x => x.id !== id);
      save(); render();
      toast(`Deleted ${p.name}; ${money(p.balance)} returned to main account`);
    }

    document.getElementById('createForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('pName').value.trim();
      const goal = round(parseFloat(document.getElementById('pGoal').value)) || 0;
      if (!name) return toast('Give your pot a name', 'error');
      if (state.pots.some(p => p.name.toLowerCase() === name.toLowerCase())) return toast('You already have a pot with that name', 'error');
      state.pots.push({ id: 'p' + Date.now(), name, balance: 0, goal: goal > 0 ? goal : 0, color: document.getElementById('pColor').value });
      save(); render(); e.target.reset();
      toast(`Pot "${name}" created`);
    });

    document.getElementById('transferForm').addEventListener('submit', e => {
      e.preventDefault();
      const from = document.getElementById('tFrom').value, to = document.getElementById('tTo').value;
      const amt = round(parseFloat(document.getElementById('tAmt').value));
      if (from === to) return toast('Pick two different pots to transfer between', 'error');
      if (!(amt > 0)) return toast('Enter an amount greater than £0', 'error');
      if (amt > balOf(from)) return toast(`Not enough in ${nameOf(from)} (${money(balOf(from))})`, 'error');
      adjust(from, -amt); adjust(to, amt);
      save(); render(); e.target.reset();
      toast(`Transferred ${money(amt)} from ${nameOf(from)} to ${nameOf(to)}`);
    });

    render();
  </script>
</body>
</html>
